<svg xmlns="http://www.w3.org/2000/svg" width="420" height="248" viewBox="0 0 420 248" role="img" aria-labelledby="title desc">
<style>:root{--bg1:#111f33;--bg2:#0b1222;--border:#3b4a65;--ink:#f3f7ff;--muted:#c6d3e6;--line:#30415a;--iconpanel:#152139;--accent:#a5b6ff}@media(prefers-color-scheme:light){:root{--bg1:#f9fbff;--bg2:#f0f4fa;--border:#bbc9dd;--ink:#13233b;--muted:#455670;--line:#c4d0e2;--iconpanel:#f4f7fc;--accent:#465499}}@media(max-width:360px){.support,.cta{font-size:20px}.kicker{font-size:14px;letter-spacing:.6px}}@media(max-width:280px){.support,.cta{font-size:22px}}</style>
<title id="title">Engine Academy</title><desc id="desc">Learn the platform. Build your own. Start learning. Decorative schematic, not a runtime screenshot.</desc>

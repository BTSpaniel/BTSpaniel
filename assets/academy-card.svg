<g font-family="Arial,Helvetica,sans-serif"><text class="kicker" x="27" y="33" fill="var(--accent)" font-size="13" letter-spacing="1" font-family="Consolas,'Liberation Mono',monospace">04 / THE STARTING POINT</text>

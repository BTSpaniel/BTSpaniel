<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
<title id="title">Particle Realms — One foundation. Many worlds.</title>
<desc id="desc">Hans / snaHt. Browser-native worlds, simulation and AI research. The original blue-glass Navi cube anchors a dark technical field.</desc>
<defs>
 <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07111e"/><stop offset=".55" stop-color="#0b172b"/><stop offset="1" stop-color="#07101b"/></linearGradient>
 <linearGradient id="ink" x2=".65" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#bbdff3"/></linearGradient>
 <linearGradient id="line"><stop stop-color="#79e5ff"/><stop offset=".66" stop-color="#6276e7"/><stop offset="1" stop-color="#132b42"/></linearGradient>
 <radialGradient id="fade"><stop offset=".78" stop-color="white"/><stop offset="1" stop-color="black"/></radialGradient>
 <mask id="art-fade"><rect x="630" y="7" width="390" height="376" fill="url(#fade)"/></mask>
 <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#29435c" stroke-opacity=".25" stroke-width=".7"/></pattern>
 <clipPath id="frame"><rect width="1040" height="390" rx="22"/></clipPath>
</defs>
<style>
text{font-family:Arial,Helvetica,sans-serif} .mono{font-family:Consolas,'Liberation Mono',monospace} .word{font-size:85px;font-weight:800;letter-spacing:-3px}
@media (max-width:600px){.small{display:none} .word{font-size:96px} .particle{transform:translateY(-5px)} .realms{transform:translateY(6px)} .art{transform:translate(-20px,-4px) scale(1.025)}}
</style>
<g clip-path="url(#frame)">
 <rect width="1040" height="390" fill="url(#bg)"/>
 <rect x="565" width="475" height="390" fill="url(#grid)"/>
 <path d="M580 0V390M605 0V390" stroke="#24384f" stroke-width="1" opacity=".48"/>
 <g fill="none" stroke="#3b698d" opacity=".3"><ellipse cx="814" cy="196" rx="182" ry="156"/><ellipse cx="814" cy="196" rx="209" ry="182"/><path d="M610 196H1038M814 0V389"/></g>
 <g class="art"><image x="632" y="7" width="390" height="376" preserveAspectRatio="xMidYMid slice" mask="url(#art-fade)" xlink:href="data:image/webp;base64,"/></g>
 <g class="small"><rect x="48" y="39" width="7" height="7" rx="1" fill="#81e9ff"/><text class="mono" x="70" y="49" font-size="16" letter-spacing="2" fill="#acc4d6">HANS / snaHt.</text><text class="mono" x="987" y="44" text-anchor="end" font-size="12" letter-spacing="2" fill="#a8c2d7">NAVI / THE SEED</text></g>
 <text class="word particle" x="43" y="159" fill="url(#ink)">PARTICLE</text>
 <text class="word realms" x="43" y="252" fill="url(#ink)">REALMS</text>
 <text class="small" x="48" y="304" font-size="24" fill="#b9d2e3">One foundation. Many worlds.</text>
 <rect x="48" y="336" width="938" height="1.5" fill="url(#line)"/>
 <text class="mono small" x="48" y="363" font-size="13" letter-spacing="1.5" fill="#b0c3d5">JAVASCRIPT + WEBGPU</text>
 <text class="mono small" x="987" y="363" text-anchor="end" font-size="13" letter-spacing="1.5" fill="#b0c3d5">ENGINE / SIMULATION / AI RESEARCH</text>
 <rect x=".75" y=".75" width="1038.5" height="388.5" rx="21.25" stroke="#2a455b" stroke-width="1.5" fill="none"/>
</g>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc">
 <title id="title">Particle Realms — one foundation, many worlds.</title>
 <desc id="desc">Hans / snaHt. A cyan isometric Navi-inspired cube with identical five-square faces, surrounded by a restrained orbital grid. Original vector composition, not an engine screenshot.</desc>
 <defs>
 <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5eff8"/><stop offset="1" stop-color="#f4f8fc"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#288bff" stop-opacity=".22"/><stop offset="1" stop-color="#288bff" stop-opacity="0"/></radialGradient>
 <linearGradient id="top" x2="0" y2="1"><stop stop-color="#49b8ef"/><stop offset="1" stop-color="#1b6197"/></linearGradient>
 <linearGradient id="left" x2="1" y2="1"><stop stop-color="#123c63"/><stop offset="1" stop-color="#1974b8"/></linearGradient>
 <linearGradient id="right" x2="1" y2="1"><stop stop-color="#2d91cc"/><stop offset="1" stop-color="#123e69"/></linearGradient>
 <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5"/></filter>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#7095b6" opacity=".4"/></pattern>
 <g id="face"><rect x="9" y="9" width="82" height="82" rx="4"/><path d="M9 50H91 M50 9V91" opacity=".22"/></g>
 <g id="five"><rect x="38" y="38" width="24" height="24" rx="1.5" fill-opacity=".8"/><rect x="19" y="19" width="9" height="9" rx="1" fill-opacity=".6"/><rect x="72" y="19" width="9" height="9" rx="1" fill-opacity=".6"/><rect x="19" y="72" width="9" height="9" rx="1" fill-opacity=".6"/><rect x="72" y="72" width="9" height="9" rx="1" fill-opacity=".6"/></g>
 </defs>
 <rect x="1" y="1" width="638" height="468" rx="20" fill="url(#wash)" stroke="#b5c8da"/>
 <rect x="24" y="20" width="592" height="355" fill="url(#dots)"/>
 <ellipse cx="483" cy="265" rx="250" ry="210" fill="url(#halo)"/>
 <g fill="none" stroke="#176ac0" stroke-width="1.5" opacity=".5"><ellipse cx="483" cy="284" rx="136" ry="58" transform="rotate(-24 483 284)"/></g>
 <g transform="translate(483 281) scale(1.24)" stroke-linejoin="round">
 <path d="M0 -80 69.282 -40 69.282 40 0 80 -69.282 40 -69.282 -40Z" fill="#1375ba" opacity=".16" stroke="#55ccff" stroke-width="9" filter="url(#glow)"/>
 <g fill="url(#top)" stroke="#8cedff" stroke-width="1.4"><path d="M0 -80 69.282 -40 0 0 -69.282 -40Z"/></g>
 <path d="M-69.282 -40 0 0 0 80 -69.282 40Z" fill="url(#left)" stroke="#5bd3ff" stroke-width="1.4"/>
 <path d="M0 0 69.282 -40 69.282 40 0 80Z" fill="url(#right)" stroke="#70e0ff" stroke-width="1.4"/>
 <g fill="none" stroke="#9cecff" stroke-width=".7" opacity=".7">
 <use href="#face" transform="matrix(.69282 .4 -.69282 .4 0 -80)"/>
 <use href="#face" transform="matrix(.69282 .4 0 .8 -69.282 -40)"/>
 <use href="#face" transform="matrix(.69282 -.4 0 .8 0 0)"/>
 </g>
 <g fill="#b6f5ff" stroke="#b6f5ff" stroke-width=".65">
 <use href="#five" transform="matrix(.69282 .4 -.69282 .4 0 -80)"/>
 <use href="#five" transform="matrix(.69282 .4 0 .8 -69.282 -40)"/>
 <use href="#five" transform="matrix(.69282 -.4 0 .8 0 0)"/>
 </g>
 <path d="M-69.282 -40 0 0 69.282 -40 M0 0V80" fill="none" stroke="#7eeaff" stroke-width="5" opacity=".35" filter="url(#glow)"/>
 <path d="M-69.282 -40 0 0 69.282 -40 M0 0V80" fill="none" stroke="#d3fbff" stroke-width="1.1"/>
 <g fill="#d6fbff"><circle cy="-80" r="1.4"/><circle cx="-69.282" cy="-40" r="1.4"/><circle cx="69.282" cy="-40" r="1.4"/><circle r="1.8"/><circle cy="80" r="1.4"/></g>
 </g>
 <g fill="#00657d" opacity=".85"><rect x="587" y="234" width="5" height="5" rx="1"/><rect x="365" y="328" width="4" height="4" rx="1"/></g>
 <g font-family="Arial, Helvetica, sans-serif" fill="#10263d"><text x="40" y="53" font-size="28" letter-spacing="2" fill="#3d5b74">HANS / snaHt.</text>
 <text x="35" y="143" font-size="74" font-weight="750" letter-spacing="-2">PARTICLE</text>
 <text x="35" y="220" font-size="74" font-weight="750" letter-spacing="-2">REALMS</text>
 <text x="40" y="290" font-size="39" fill="#3d5b74">One foundation.</text>
 <text x="40" y="338" font-size="39" fill="#3d5b74">Many worlds.</text>
 <path d="M40 412H148" stroke="#00657d" stroke-width="4"/>
 <text x="174" y="420" font-size="26" letter-spacing="2" fill="#3d5b74">BROWSER-NATIVE</text></g>
 </svg>